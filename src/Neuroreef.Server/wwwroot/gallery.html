<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuroreef bodies</title>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<style>
  html, body { margin: 0; height: 100%; background: #0b1622; color: #d7e3ee; font: 13px system-ui, sans-serif; overflow: hidden; }
  #info { position: fixed; top: 8px; left: 10px; right: 10px; color: #8aa0b5; }
  canvas { display: block; width: 100%; height: 100%; }
  .lab { position: fixed; transform: translate(-50%, 0); font-size: 10px; line-height: 1.25; color: #d7e3ee; text-align: center; text-shadow: 0 1px 2px #000; white-space: nowrap; pointer-events: none; }
  .lab b { color: #ffd34d; font-weight: 600; }
  .row { position: fixed; transform: translate(0, -50%); font-size: 12px; color: #ffd34d; text-shadow: 0 1px 2px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="info"></div>
<canvas id="c"></canvas>
<script type="module">
// A body gallery for checking the parametric organism body without running the world. Every tile is one
// gene combination drawn by the same shader the console uses (js/creatures/body.js, anim.js).
//   ?view=arch      labelled appearance sweeps (each: four variants near, then the low-detail body)
//   ?view=grid      a grid of random gene combinations, seeded by ?seed=N
//   ?row=N          one appearance row only (close up)
//   (default: both) ?gait=0..1 · ?act=eat|strike|rest · ?t=seconds freezes time · ?true=1 true relative sizes
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';
import { bodyGeometry, bodyMaterial, bodyMesh, setBody, commitBodies, bodySize, massOf, locoOf, triangles, DEFAULT_APPEARANCE } from './js/creatures/body.js';

const q = new URLSearchParams(location.search);
const row = q.has('row') ? +q.get('row') : -1, view = row >= 0 ? 'arch' : q.get('view') || 'both', seed = +(q.get('seed') || 1), trueSize = q.has('true');
const gait = q.has('gait') ? +q.get('gait') : 0.6;
const act = { eat: 1, strike: 2 }[q.get('act')] || 0, rest = q.get('act') === 'rest' ? 1 : 0;
const frozen = q.has('t') ? +q.get('t') : null;

function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = mulberry(seed * 7919 + 13);
const organ = () => (Math.floor(rnd() * 255) - 127 + 127) / 254;     // a uniform int8 gene as an organ size

const SWEEPS = [
  ['body proportions', [0, 1, 2]],
  ['head · neck · tail', [3, 4, 5]],
  ['limb placement · shape', [6, 7]],
  ['fin outline', [8]],
  ['wing outline', [9]],
  ['pigment · markings', [10, 11, 12, 13, 14, 15]],
];

const tiles = [];   // { body, color (hex), x, z, far, label }
let x0 = 0;
if (view !== 'grid') {
  SWEEPS.forEach(([name, genes], r) => {
    if (row >= 0 && r !== row) return;
    for (let i = 0; i < 5; i++) {
      const appearance = new Float32Array(DEFAULT_APPEARANCE), u = (i === 4 ? 0 : i) / 3;
      appearance[11] = 0.65;
      for (let j = 0; j < genes.length; j++) appearance[genes[j]] = j % 2 ? 1 - u : u;
      const b = { legs: 0.65, fins: 0.65, wings: 0.65, sight: 0.5, armour: 0.3, strike: 0.3, meat: 0.2, m01: 0.5, legPairs: 2, finPairs: 2, eyePairs: 1, fur: r === 0 ? u : 0, append: r === 1 ? u : 0, appearance };
      tiles.push({ body: b, color: 0x8aa0b5, x: i * 10 + (i === 4 ? 1 : 0), z: r * 10, far: i === 4, row: i === 0 ? name : null });
    }
  });
  x0 = 62;
}
if (view !== 'arch') {
  const cols = 6, rows = view === 'grid' ? 5 : 6;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const b = { legs: organ(), fins: organ(), wings: organ(), sight: organ(), armour: organ(), strike: organ(), meat: Math.min(0.95, organ()), m01: organ(), legPairs: 1 + Math.floor(rnd() * 4), finPairs: 1 + Math.floor(rnd() * 4), eyePairs: 1 + Math.floor(rnd() * 4), fur: organ(), append: organ(), appearance: Float32Array.from({ length: 16 }, organ) };
    const color = new THREE.Color().setHSL(rnd(), 0.55, 0.5).getHex();
    tiles.push({ body: b, color, x: x0 + c * 10, z: r * 10, far: false });
  }
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b1622);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x3a2f22, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dd, 1.6); sun.position.set(0.4, 1, 0.25); scene.add(sun);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1000);
const controls = new OrbitControls(camera, canvas);

const mat = bodyMaterial(), nearGeo = bodyGeometry('near'), farGeo = bodyGeometry('far');
mat.userData.uniforms.uSpeciesOverlay.value = q.has('overlay') ? 1 : 0;
const N = bodyMesh(nearGeo, mat, tiles.length), F = bodyMesh(farGeo, mat, tiles.length);
scene.add(N.mesh, F.mesh);
let nn = 0, nf = 0;
const labels = [], col = new THREE.Color(), f2 = (v) => v.toFixed(2).replace(/^0/, '');
tiles.forEach((tl, i) => {
  const b = tl.body, mass = massOf(b.m01 * 255 - 128), loco = (b.loco = locoOf(b.legs, b.fins, b.wings, mass));
  const sc = trueSize ? bodySize(mass) : Math.max(0.9, Math.min(2.4, bodySize(mass)));
  const y = loco === 'Swim' ? 0.45 * sc : loco === 'Fly' && !rest ? 0.5 + 0.8 * sc : 0;
  col.setHex(tl.color);
  const B = tl.far ? F : N, k = tl.far ? nf++ : nn++;
  setBody(B, k, tl.x, y, tl.z, 0.5, sc, sc * (rest && loco !== 'Fly' ? 0.7 : 1), b, loco === 'Sessile' ? 0 : gait, (i * 0.37) % 1, act, rest, col.r, col.g, col.b);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 7.6), new THREE.MeshLambertMaterial({ color: loco === 'Swim' ? 0x1d4a66 : loco === 'Wade' ? 0x2c5a55 : 0x3b4a2a }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(tl.x, -0.01, tl.z); scene.add(ground);
  const l = document.createElement('div'); l.className = 'lab';
  l.innerHTML = `<b>${loco}</b> · mass ${mass < 1 ? mass.toFixed(2) : mass.toFixed(1)}${tl.far ? ' · low detail' : ''}<br>` +
    `legs ${f2(b.legs)} ×${2 * b.legPairs} fins ${f2(b.fins)} ×${2 * (b.finPairs || 1)} wings ${f2(b.wings)}<br>fur ${f2(b.fur)} appendages ${f2(b.append)} · appearance ${Array.from(b.appearance, f2).join(' ')}`;
  document.body.append(l); labels.push([l, new THREE.Vector3(tl.x, 0, tl.z + 3.0)]);
  if (tl.row && tl.x === 0) {
    const r = document.createElement('div'); r.className = 'row'; r.textContent = tl.row; document.body.append(r);
    labels.push([r, new THREE.Vector3(tl.x - 4.8, 0, tl.z - 3.8), true]);
  }
});
commitBodies(N, nn); commitBodies(F, nf);
document.getElementById('info').textContent = `Neuroreef bodies · one parametric body from genes · near ${triangles(nearGeo)} triangles, far ${triangles(farGeo)} · ` +
  `?view=arch|grid · ?row=N · ?seed=N · ?gait=0..1 · ?act=eat|strike|rest · ?t=seconds freezes time · ?true=1 true sizes · ?overlay=1 species colours`;

// frame all tiles
const xs = tiles.map((t) => t.x), zs = tiles.map((t) => t.z);
const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cz = (Math.min(...zs) + Math.max(...zs)) / 2;
const span = Math.max((Math.max(...xs) - Math.min(...xs) + 10) * (row >= 0 ? 0.68 : 0.85), (Math.max(...zs) - Math.min(...zs) + 10) * 1.3);
controls.target.set(cx, 0, cz + 0.5); camera.position.set(cx, span * (row >= 0 ? 0.45 : 1.05), cz + span * (row >= 0 ? 0.75 : 0.6)); controls.update();

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const t0 = performance.now();
function frame() {
  mat.userData.uniforms.uTime.value = frozen ?? (performance.now() - t0) / 1000;
  controls.update(); renderer.render(scene, camera);
  for (const [l, p, left] of labels) {
    const v = p.clone().project(camera);
    l.style.left = (v.x + 1) / 2 * innerWidth + 'px'; l.style.top = (1 - v.y) / 2 * innerHeight + 'px';
    if (left) l.style.transform = 'translate(0, -110%)';
  }
  window.galleryReady = true;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
